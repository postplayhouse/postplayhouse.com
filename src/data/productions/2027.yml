- title: The Drowsy Chaperone
  rating: H
  rating_explanation: "A comic portrait of 1920s excess: a tipsy chaperone, innuendo, and cartoonish gangsters."
  short_title: Drowsy
  color: blue
  image: drowsy-chaperone.png
  image_background: false
  dark_mode_image: drowsy-chaperone-dark.png
  opening: 2027-06-25
  writers:
  description: |
    When a devoted musical-theatre fan puts on the cast recording of his favorite fictional 1928 musical, the show suddenly springs to life around him. What follows is a gleeful parade of Broadway characters: a bride and groom on the eve of their wedding, a bumbling best man, a frantic producer, gangsters disguised as pastry chefs, an enthusiastic would-be Latin lover, and, of course, one very drowsy chaperone. Winner of five Tony Awards, **The Drowsy Chaperone** is a hilarious and affectionate send-up of classic musical theatre, packed with comedy, romance, spectacular song-and-dance numbers, and surprises.
