  description: |
    When teenager Ren McCormack and his mother move from Chicago to a small farming town, he expects life to be different. He doesn’t expect to discover a community where dancing has been banned. As Ren challenges the rules and tries to find his place among his new classmates, he finds himself at odds with the town’s powerful local preacher—and drawn to the preacher’s rebellious daughter. Featuring the electrifying hits “Footloose,” “Let’s Hear It for the Boy,” “Holding Out for a Hero,” and more, **Footloose** is an energetic story of young people finding their voices and generations learning to listen to one another.
