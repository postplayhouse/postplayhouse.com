- title: Honky Tonk Angels
  rating: H
  rating_explanation: "Grown-up country humor and songs about drinking, cheating, and heartbreak. A concert-style show that may not hold young children's attention."
  short_title: Angels
  color: green
  image: honky-tonk-angels.png
  image_background: false
  opening: 2027-06-04
  writers:
  description: |
    Three women from different walks of life share one big dream: making it to Nashville. Angela, Darlene, and Sue Ellen set out in pursuit of country music stardom and discover friendship, laughter, and plenty of music along the way. **Honky Tonk Angels**, from *Always…Patsy Cline* creator Ted Swindley, is a rollicking country jukebox musical filled with beloved songs including “Stand by Your Man,” “Coal Miner’s Daughter,” “9 to 5,” “These Boots Are Made for Walkin’,” “Harper Valley PTA,” and more. It’s a joyful, foot-stomping celebration of friendship, following your dreams, and classic country music.
