  image: addams-family.png
  image_background: false
  dark_mode_image: addams-family-dark.png
  opening: 2027-06-11
  writers:
  description: |
    Wednesday Addams has grown up—and fallen in love. Her boyfriend is sweet, smart, and from a perfectly respectable family, which presents Gomez and Morticia Addams with a situation far more frightening than anything lurking in their family crypt. When Wednesday asks Gomez to keep a secret from Morticia and the two families come together for dinner, one very unusual evening puts love, honesty, and family loyalty to the test. Based on Charles Addams’ iconic characters, **The Addams Family** is a delightfully macabre musical comedy about growing up, falling in love, and discovering that every family is a little strange.
